clone:
  git:
    image: harbor.crystalnet.org/dockerhub-proxy/woodpeckerci/plugin-git:2.7.0
    settings:
      partial: false
      depth: 1

steps:
  docker-build-release:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: harbor.crystalnet.org/library/deepseek-harness
      logins:
      - registry: https://harbor.crystalnet.org/
        username: robot$library+woodpecker
        password:
          from_secret: harbor_token
      registry: harbor.crystalnet.org
      auto_tag: true
      dockerfile: Dockerfile
      # forwards Woodpecker's own CI_COMMIT_SHA env var directly under the
      # same name - ${CI_COMMIT_SHA} string-interpolated into a build_args
      # item resolved to empty in this setup, confirmed via a real failed
      # build (see Dockerfile's ARG CI_COMMIT_SHA comment)
      build_args_from_env:
      - CI_COMMIT_SHA
      platforms: linux/amd64
      dry_run: false
when:
  branch: ${CI_REPO_DEFAULT_BRANCH}
  event: tag
